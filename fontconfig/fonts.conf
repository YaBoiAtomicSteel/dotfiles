<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
<alias>
  <family>serif</family>
  <prefer>
    <family>InputSerif Nerd Font</family>
  </prefer>
</alias>
<alias>
  <family>sans</family>
  <prefer>
    <family>InputSans Nerd Font</family>
  </prefer>
</alias>
<alias>
  <family>mono</family>
  <prefer>
    <family>JetBrainsMono Nerd Font Mono</family>
  </prefer>
</alias>
</fontconfig>
